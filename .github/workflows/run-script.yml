name: Run data pipeline

on:
  workflow_dispatch:      
  schedule:
    - cron: '0 6 * * 1'

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Run script
        run: uv run healthly_life_expectancy_lcr

      - name: Commit updated xlsx files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add HealthyLifeExpectancyLCR.xlsx
          git add ChangeInHealthyLifeExpectancyLCR.xlsx
          git diff --staged --quiet || git commit -m "Update filtered XLSX files"
          git push
